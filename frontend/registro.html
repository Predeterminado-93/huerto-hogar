<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar | Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Crear una cuenta</h1>

        <nav>
            <ul>
               <li><a href="index.html">Inicio</a> </li>
               <li><a href="productos.html">Productos</a> </li>
               <li><a href="blog.html">Blog</a> </li>
               <li><a href="contacto.html">Contacto</a> </li>
               <li><a href="nosotros.html">Nosotros</a> </li>
               <li><a href="login.html">Login</a> </li>
               <li><a href="registro.html">Registro</a> </li>
               <li><a href="carrito.html">Carrito</a> </li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Registro de usuario</h2>

            <form id="formulario-registro">
                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" maxlength="100" required>
                    <p id="error-nombre"></p>
                </div>

                <div>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" maxlength="100" required>
                    <p id="error-correo"></p>
                </div>

                <div>
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" minlength="4" maxlength="10" required>
                    <p id="error-contrasena"></p>
                </div>

                <div>
                    <label for="confirmar-contrasena">Confirmar contraseña:</label>
                    <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" minlength="4" maxlength="10" required>
                    <p id="error-confirmar-contrasena"></p>
                </div>

                <button type="submit">Registrarse</button>
            </form>

            <p>
                ¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión aquí</a>
            </p>
        </section>
    </main>

    <footer>
        <p>HuertoHogar | Desde el campo hasta tu puerta, productos frescos y de calidad.</p>
        <p>2026 HuertoHogar</p>
    </footer>
    <script src="js/registro.js"></script>
</body>
</html>
