<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar | Administración</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Administración HuertoHogar</h1>

        <nav>
            <ul>
               <li><a href="index.html">Inicio</a> </li>
               <li><a href="productos.html">Productos</a> </li>
               <li><a href="blog.html">Blog</a> </li>
               <li><a href="contacto.html">Contacto</a> </li>
               <li><a href="nosotros.html">Nosotros</a> </li>
               <li><a href="login.html">Login</a> </li>
               <li><a href="registro.html">Registro</a> </li>
               <li><a href="carrito.html">Carrito</a> </li>
               <li><a href="administracion.html">Administración</a> </li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Gestión de productos</h2>

            <form id="formulario-producto">
                <div>
                    <label for="codigo-producto">Código del producto:</label>
                    <input type="text" id="codigo-producto" maxlength="50" required>
                </div>

                <div>
                    <label for="nombre-producto">Nombre del producto:</label>
                    <input type="text" id="nombre-producto" maxlength="100" required>
                </div>

                <div>
                    <label for="descripcion-producto">Descripción:</label>
                    <textarea id="descripcion-producto" maxlength="500"></textarea>
                </div>

                <div>
                    <label for="precio-producto">Precio:</label>
                    <input type="number" id="precio-producto" min="0" step="0.01" required>
                </div>

                <div>
                    <label for="stock-producto">Stock:</label>
                    <input type="number" id="stock-producto" min="0" step="1" required>
                </div>

                <div>
                    <label for="stock-critico-producto">Stock crítico:</label>
                    <input type="number" id="stock-critico-producto" min="0" step="1">
                </div>

                <div>
                    <label for="categoria-producto">Categoría:</label>
                    <select id="categoria-producto" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="Frutas Frescas">Frutas Frescas</option>
                        <option value="Verduras Orgánicas">Verduras Orgánicas</option>
                        <option value="Productos Orgánicos">Productos Orgánicos</option>
                        <option value="Productos Lácteos">Productos Lácteos</option>
                    </select>
                </div>

                <button type="submit">Agregar producto</button>
            </form>
        </section>

        <section>
            <h2>Productos registrados</h2>
            <div id="lista-administracion"></div>
        </section>
    </main>

    <footer>
        <p>HuertoHogar | Desde el campo hasta tu puerta, productos frescos y de calidad.</p>
        <p>2026 HuertoHogar</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/administracion.js"></script>
</body>
</html>
