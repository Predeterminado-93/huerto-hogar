<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar | Productos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Catálogo de productos</h1>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="administracion.html">Administración</a></li>
                <li><a href="perfil.html">Mi perfil</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Buscar productos</h2>

            <form id="formulario-filtros">
                <div>
                    <label for="buscador-productos">Buscar por nombre:</label>
                    <input
                        type="text"
                        id="buscador-productos"
                        placeholder="Escribe el nombre de un producto"
                    >
                </div>

                <div>
                    <label for="filtro-categoria">Filtrar por categoría:</label>
                    <select id="filtro-categoria">
                        <option value="todas">Todas las categorías</option>
                    </select>
                </div>
            </form>
        </section>

        <section>
            <div id="contenedor-productos"></div>
        </section>
    </main>

    <footer>
        <p>HuertoHogar | Desde el campo hasta tu puerta, productos frescos y de calidad.</p>
        <p>2026 HuertoHogar</p>
    </footer>

    <script src="js/app.js"></script>

    <script>
    const buscadorProductos = document.getElementById("buscador-productos");
    const filtroCategoria = document.getElementById("filtro-categoria");

    function normalizarTexto(texto) {
        return String(texto)
            .toLowerCase()
            .trim()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");
    }

    function cargarCategorias() {
        const categorias = [];

        productos.forEach(function(producto) {
            if (producto.categoria && !categorias.includes(producto.categoria)) {
                categorias.push(producto.categoria);
            }
        });

        categorias.sort();

        categorias.forEach(function(categoria) {
            const opcion = document.createElement("option");

            opcion.value = categoria;
            opcion.textContent = categoria;

            filtroCategoria.appendChild(opcion);
        });
    }

    function aplicarFiltros() {
        const textoBuscado = normalizarTexto(buscadorProductos.value);
        const categoriaSeleccionada = normalizarTexto(filtroCategoria.value);

        const secciones = document.querySelectorAll(
            "#contenedor-productos > section"
        );

        secciones.forEach(function(seccion) {
            const tituloCategoria = seccion.querySelector("h2");

            if (!tituloCategoria) {
                return;
            }

            const categoriaDeSeccion = normalizarTexto(
                tituloCategoria.textContent
            );

            const categoriaCoincide =
                categoriaSeleccionada === "todas"
                || categoriaDeSeccion === categoriaSeleccionada;

            const tarjetas = seccion.querySelectorAll("article");
            let cantidadVisible = 0;

            tarjetas.forEach(function(tarjeta) {
                const tituloProducto = tarjeta.querySelector("h3");

                if (!tituloProducto) {
                    return;
                }

                const nombreProducto = normalizarTexto(
                    tituloProducto.textContent
                );

                const nombreCoincide =
                    nombreProducto.includes(textoBuscado);

                if (categoriaCoincide && nombreCoincide) {
                    tarjeta.style.display = "";
                    cantidadVisible++;
                } else {
                    tarjeta.style.display = "none";
                }
            });

            seccion.style.display = cantidadVisible > 0 ? "" : "none";
        });
    }

    cargarCategorias();

    buscadorProductos.addEventListener("input", aplicarFiltros);
    filtroCategoria.addEventListener("change", aplicarFiltros);
</script>
<script src="js/app.js"></script>
</body>
</html>
